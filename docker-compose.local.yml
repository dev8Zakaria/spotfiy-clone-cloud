services:
  postgres:
    image: postgres:15
    container_name: spotify-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spotify
      POSTGRES_USER: spotify_app
      POSTGRES_PASSWORD: ChangeThisPassword123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotify_app -d spotify"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: spotify-local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ChangeThisMinIOPassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - local_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  local_postgres_data:
  local_minio_data:
