global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "spotify-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "192.168.0.210:80"
        labels:
          vm: "vm1-gateway"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "192.168.0.210:9100"
        labels:
          vm: "vm1-gateway"
      - targets:
          - "192.168.0.220:9100"
        labels:
          vm: "vm2-database"
      - targets:
          - "192.168.0.230:9100"
        labels:
          vm: "vm3-storage"
      - targets:
          - "localhost:9100"
        labels:
          vm: "vm4-monitor"
