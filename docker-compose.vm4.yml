services:
  prometheus:
    image: prom/prometheus:latest
    container_name: spotify-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: spotify-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: GrafanaDemo12345
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:latest
    container_name: spotify-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - "/:/host:ro,rslave"

volumes:
  prometheus_data:
  grafana_data:
