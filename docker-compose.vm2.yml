services:
  postgres:
    image: postgres:15
    container_name: spotify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spotify
      POSTGRES_USER: spotify_app
      POSTGRES_PASSWORD: ensa123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotify_app -d spotify"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
